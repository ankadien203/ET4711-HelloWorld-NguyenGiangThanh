
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thẻ sinh viên</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="student-card">
        <div class="card-header">
            <h2>HANOI UNIVERSITY OF SCIENCE AND TECHNOLOGY</h2>
            <p>THẺ SINH VIÊN</p>
        </div>

        <div class="card-body">
            <img
                src="images/avatar.jpg"
                alt="Ảnh sinh viên"
                id="studentImage"
                class="avatar"
            >

            <div class="student-info">
                <p><strong>Họ và tên:</strong>
                    <span id="studentName">Nguyễn Giang Thành</span>
                </p>
                <p><strong>MSSV:</strong>
                    <span id="studentId">20250345E</span>
                </p>
                <p><strong>Quê quán:</strong>
                    <span id="studentAddress">Phú Thọ</span>
                </p>
                <p><strong>Ngày sinh:</strong>
                    <span id="studentDob">05/04/2003</span>
                </p>
            </div>
        </div>

        <div class="card-footer">
            <span>STUDENT IDENTIFICATION CARD</span>
        </div>
    </div>

    <button id="changeButton">Đổi thông tin mẫu</button>

    <script src="script.js"></script>
</body>
</html>
